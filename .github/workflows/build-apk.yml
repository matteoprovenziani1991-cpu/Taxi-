
name: Build taxi€ APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Errore: nessun file ZIP trovato nel repository"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d extracted
          PROJECT_DIR=$(find extracted -type f \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Errore: non trovo i file Gradle del progetto Android"
            find extracted -maxdepth 4 -type f
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "Errore: manca gradlew nel progetto"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taxi-euro-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
